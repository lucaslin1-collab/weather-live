# Runs the live bot on GitHub's servers and publishes its site on GitHub Pages (Settings > Pages > Source: GitHub Actions).
#   every 10 min, 13:00-01:50 UTC  -> one live cycle (covers 10 a.m.-4 p.m. in every US time zone)
#   12:40 UTC daily                 -> refresh history and settled markets; Mondays also re-run the backtest
#   first push (no trained models)  -> full setup
name: Live bot

# GitHub runs scheduled jobs on a best-effort basis: they can start minutes to hours late.
on:
  push:
    branches: [main]
    paths-ignore: ["data/**", "results/**", "README.md"]
  schedule:
    - cron: "*/10 13-23 * * *"
    - cron: "*/10 0-1 * * *"
    - cron: "40 12 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run = one live cycle; update = refresh data; backtest = re-score and retrain; setup = first-time setup"
        type: choice
        options: [run, update, backtest, setup]
        default: run

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live-bot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main   # always start from the latest saved data, not the commit that queued the run

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - id: pages
        uses: actions/configure-pages@v5

      - name: Run the bot
        env:
          MODE: ${{ github.event.inputs.mode || (github.event_name == 'push' && 'update') || (github.event.schedule == '40 12 * * *' && 'update') || 'run' }}
          PYTHONUNBUFFERED: "1"
          TIME_BUDGET_MIN: ${{ (github.event_name == 'schedule' && github.event.schedule != '40 12 * * *') && '8' || '240' }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          # Real orders stay off unless you set the LIVE_TRADING variable and both secrets.
          LIVE_TRADING: ${{ vars.LIVE_TRADING }}
          KALSHI_ENV: ${{ vars.KALSHI_ENV }}
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: |
          if [ "$MODE" = "setup" ] || [ ! -f results/models.pkl ]; then
            python live.py setup
          elif [ "$MODE" = "backtest" ]; then
            python live.py backtest && python live.py run
          elif [ "$MODE" = "update" ]; then
            python live.py update
            python live.py backtest --if-stale || true
            python live.py run
          else
            # While history is incomplete, each 10-minute run also backfills a slice
            if python live.py needs-backfill; then python live.py update || true; fi
            python live.py run
          fi

      - name: Save data back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data results
          if ! git diff --cached --quiet; then
            git commit -m "Live data $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -X theirs origin main   # on conflict, keep this run's data
            git push
          fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
